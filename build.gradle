            url "artifactregistry://asia-east2-maven.pkg.dev/drojiancode/public"
        }
        //逐步废弃
        maven {
            url = 'https://maven.drojian.dev/repository/drojian-common/'
            credentials {
                username = 'common'
                password = 'YO&MZE4pC0eGEa4c#c@241030'
            }
        }
        maven { url 'https://artifact.bytedance.com/repository/pangle' }
        maven {
            url = 'https://maven.drojian.dev/repository/music-release/'
            credentials {
                username = 'music-reader'
                password = 'PDJSxW6mnZD!KZgx7X@241030'
            }
        }
        maven {
            url = 'https://maven.drojian.dev/repository/music-snapshots'
            credentials {
                username = 'music-reader'
                password = 'PDJSxW6mnZD!KZgx7X@241030'
            }
        }
        //Flutter Support
        String storageUrl = System.env.FLUTTER_STORAGE_BASE_URL ?: "https://storage.googleapis.com"
