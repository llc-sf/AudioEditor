            url "https://plugins.gradle.org/m2/"
        }
        maven {
            url "artifactregistry://asia-east2-maven.pkg.dev/drojiancode/public"
        }
        maven {
            url = 'https://maven.drojian.dev/repository/drojian-common/'
            credentials {
                username = 'common'
                password = 'YO&MZE4pC0eGEa4c#c@241030'
            }
        }
        maven {
            url 'https://maven.google.com'
            name 'Google'
        }
        maven { url "https://maven.aliyun.com/repository/jcenter" }
