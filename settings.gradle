pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }
}

buildscript {
    repositories {
        mavenCentral()
        maven {
            url "https://plugins.gradle.org/m2/"
        }
    }
    dependencies {
        classpath "gradle.plugin.com.google.cloud.artifactregistry:artifactregistry-gradle-plugin:2.2.1"
        classpath "com.google.guava:guava:33.3.0-jre"
    }
}

plugins {
    id("org.gradle.toolchains.foojay-resolver-convention") version "0.9.0"
    id("com.google.cloud.artifactregistry.gradle-plugin") version "2.2.1"
}

rootProject.name = "AudioEditor"
include ':app'
include ':waveform'
include ':ffmpegLib'
include ':timeRuler'
//include ':recorderLib'
include ':framework-base'
include ':framework-utils'
include ':framework-language'
include ':framework-themes-deps'
include ':framework-dimens-375'
include ':framework-appprovider'
include ':framework-simplecache'
include ':framework-rx' //todo 是否需要
include ':framework-data' //todo 是否需要
include ':framework-sort' //todo 是否需要
include ':font' //todo 是否需要

include ':app-business-base'


//Widget控件扩展
include ':widget-toast'
include ':widget-recyclerview'
include ':widget-image'
include ':widget-text'
include ':widget-link' //todo 是否需要


